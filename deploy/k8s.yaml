# chonkbase.net/griswold: a small static site next to the main frontend.
# The longer /griswold prefix wins over the frontend's / on the same host.
apiVersion: v1
kind: Namespace
metadata:
  name: griswold
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: griswold-site
  namespace: griswold
  labels:
    app.kubernetes.io/name: griswold-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: griswold-site
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: griswold-site
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # deploy-site.sh sets the real tag.
          image: ghcr.io/chriskearney/griswold-site:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: griswold-site
  namespace: griswold
spec:
  selector:
    app.kubernetes.io/name: griswold-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: griswold-site
  namespace: griswold
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  rules:
    - host: chonkbase.net
      http:
        paths:
          - path: /griswold
            pathType: Prefix
            backend:
              service:
                name: griswold-site
                port:
                  name: http
    # People type www. Without this rule the main frontend answers and the
    # download link returns its HTML. The frontend's certificate covers www.
    - host: www.chonkbase.net
      http:
        paths:
          - path: /griswold
            pathType: Prefix
            backend:
              service:
                name: griswold-site
                port:
                  name: http
  tls:
    - hosts:
        - chonkbase.net
      secretName: griswold-tls
