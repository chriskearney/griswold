# Serves the landing page under /griswold/ behind the cluster ingress.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects stay relative, so they keep the public scheme and host.
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Relative links on the page only resolve with the trailing slash.
    location = /griswold {
        return 301 /griswold/;
    }

    location /griswold/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /griswold/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /griswold/download/ {
        try_files $uri =404;
        types { application/x-apple-diskimage dmg; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
